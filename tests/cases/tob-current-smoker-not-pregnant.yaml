# Test case: Adult current smoker, not pregnant - full cessation intervention
# USPSTF: "provide behavioral interventions and FDA-approved pharmacotherapy"

id: tob-current-smoker-not-pregnant
description: "35yo current smoker, not pregnant - full cessation intervention"
tags:
  - tobacco-screening
  - current-smoker
  - full-intervention

expected:
  RecordTobaccoUse: false
  AdviseToQuit: true
  OfferPharmacotherapy: true
  OfferBehavioralTherapy: true
  AgeInYears: 35
  IsCurrentTobaccoUser: true
  IsPregnant: false

resources:
  - resourceType: Patient
    id: tob-current-smoker-not-pregnant
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-patient
      tag:
        - system: http://example.org/test-lifecycle
          code: tob-test
        - system: http://example.org/test-lifecycle
          code: tob-current-smoker-not-pregnant
    extension:
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-race
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2106-3"
              display: White
          - url: text
            valueString: White
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2186-5"
              display: Not Hispanic or Latino
          - url: text
            valueString: Not Hispanic or Latino
    identifier:
      - system: http://hospital.smarthealthit.org
        value: tob-current-smoker-not-pregnant
    name:
      - family: Smoker
        given:
          - Current
    gender: female
    birthDate:
      $fn: yearsAgo
      years: 35

  - resourceType: Observation
    id: tob-current-smoker-not-pregnant-smoking
    meta:
      profile:
        - http://hl7.org/fhir/us/core/StructureDefinition/us-core-smokingstatus
      tag:
        - system: http://example.org/test-lifecycle
          code: tob-test
        - system: http://example.org/test-lifecycle
          code: tob-current-smoker-not-pregnant
    status: final
    category:
      - coding:
          - system: http://terminology.hl7.org/CodeSystem/observation-category
            code: social-history
            display: Social History
    code:
      coding:
        - system: http://loinc.org
          code: "72166-2"
          display: Tobacco smoking status
    subject:
      reference: Patient/tob-current-smoker-not-pregnant
    effectiveDateTime:
      $fn: daysAgo
      days: 30
    valueCodeableConcept:
      coding:
        - system: http://snomed.info/sct
          code: "449868002"
          display: Current every day smoker
