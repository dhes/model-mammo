# Test case: Flex sig 8 years ago + FIT 6 months ago - should NOT recommend
# Combo strategy: flex sig every 10 years + annual FIT covers the patient

id: crc-not-due-combo
description: "Age 55, flex sig 8y ago + FIT 6mo ago - not due (combo strategy)"
tags:
