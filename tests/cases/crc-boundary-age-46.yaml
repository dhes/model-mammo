# Test case: Age exactly 46, no screening - first day eligible
# CMS130 specifies ages 46-75, so 46 is the first eligible age

id: crc-boundary-age-46
description: "Age 46 (first eligible day), no screening - due"
tags:
  - colorectal-cancer-screening
  - positive-case
  - boundary-case
  - age-boundary

