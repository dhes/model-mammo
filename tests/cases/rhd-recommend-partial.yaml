id: rhd-recommend-partial
description: "Pregnant woman with only Rh type done (no antibody screen) - should still recommend"
expected:
  PerformRhDAndAntibodyTests: true
  IsCurrentlyPregnant: true
  RhTypingDone: true
  AntibodyScreenDone: false
  RhDAndAntibodyScreenDone: false

resources:
  - resourceType: Patient
    id: rhd-recommend-partial
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-patient
      tag:
        - system: http://example.org/test-lifecycle
          code: rhd-test
        - system: http://example.org/test-lifecycle
          code: rhd-recommend-partial
    gender: female
    birthDate:
      $fn: yearsAgo
      years: 27

  - resourceType: Condition
    id: rhd-recommend-partial-pregnancy
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-condition-problems-health-concerns
      tag:
        - system: http://example.org/test-lifecycle
          code: rhd-test
        - system: http://example.org/test-lifecycle
          code: rhd-recommend-partial
    clinicalStatus:
      coding:
        - system: http://terminology.hl7.org/CodeSystem/condition-clinical
          code: active
    verificationStatus:
      coding:
        - system: http://terminology.hl7.org/CodeSystem/condition-ver-status
          code: confirmed
    category:
      - coding:
          - system: http://terminology.hl7.org/CodeSystem/condition-category
            code: problem-list-item
    code:
      coding:
        - system: http://snomed.info/sct
          code: "77386006"
          display: "Pregnancy (finding)"
    subject:
      reference: Patient/rhd-recommend-partial
    onsetDateTime:
      $fn: monthsAgo
      months: 1

  # Only Rh type done - no antibody screen
  - resourceType: Observation
    id: rhd-recommend-partial-rhtype
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-simple-observation
      tag:
        - system: http://example.org/test-lifecycle
          code: rhd-test
        - system: http://example.org/test-lifecycle
          code: rhd-recommend-partial
    status: final
    category:
      - coding:
          - system: http://terminology.hl7.org/CodeSystem/observation-category
            code: laboratory
            display: Laboratory
    code:
      coding:
        - system: http://loinc.org
          code: "883-9"
          display: "ABO and Rh group [Type] in Blood"
    subject:
      reference: Patient/rhd-recommend-partial
    effectiveDateTime:
      $fn: daysAgo
      days: 14
    valueString: "A Negative"
