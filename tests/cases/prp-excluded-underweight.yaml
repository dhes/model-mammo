          code: prp-test
        - system: http://example.org/test-lifecycle
          code: prp-excluded-underweight
    status: final
    category:
      - coding:
          - system: http://terminology.hl7.org/CodeSystem/observation-category
            code: vital-signs
            display: Vital Signs
    code:
      coding:
        - system: http://loinc.org
          code: "29463-7"
          display: "Body weight"
