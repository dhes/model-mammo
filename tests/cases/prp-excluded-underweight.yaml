id: prp-excluded-underweight
description: "Adult with weight under 35 kg - should not recommend PrEP"
expected:
  PrescribePrEP: false
  MeetsAgeRequirement: true
  MeetsWeightRequirement: false

resources:
  - resourceType: Patient
    id: prp-excluded-underweight
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-patient
      tag:
        - system: http://example.org/test-lifecycle
          code: prp-test
        - system: http://example.org/test-lifecycle
          code: prp-excluded-underweight
    gender: female
    birthDate:
      $fn: yearsAgo
      years: 18

