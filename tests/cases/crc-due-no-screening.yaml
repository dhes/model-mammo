# Test case: Age 50, no screening history - should recommend screening
# This is the baseline positive case for colorectal cancer screening

id: crc-due-no-screening
description: "Age 50, no screening history - colorectal screening due"
tags:
  - colorectal-cancer-screening
  - positive-case
  - no-screening-history

expected:
  ColorectalScreeningDue: true
  IsEligibleAge: true
  IsExcluded: false
  IsUpToDateOnScreening: false
  HasFOBTInLastYear: false
  HasDNAFITInLastTwoYears: false
  HasColonoscopyInLastTenYears: false
  AgeInYears: 50

resources:
  - resourceType: Patient
    id: crc-due-no-screening
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-patient
      tag:
        - system: http://example.org/test-lifecycle
          code: crc-test
        - system: http://example.org/test-lifecycle
          code: crc-due-no-screening
    extension:
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-race
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2106-3"
              display: White
          - url: text
            valueString: White
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2186-5"
              display: Not Hispanic or Latino
          - url: text
            valueString: Not Hispanic or Latino
    identifier:
      - system: http://hospital.smarthealthit.org
        value: crc-due-no-screening
    name:
      - family: TestPatient
        given:
          - Screening
    gender: male
    birthDate:
      $fn: yearsAgo
      years: 50
