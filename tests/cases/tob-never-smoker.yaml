# Test case: Adult never smoker - no cessation intervention needed
# Status recorded, never used tobacco = no intervention

id: tob-never-smoker
description: "40yo never smoker - no intervention needed"
tags:
  - tobacco-screening
  - never-smoker
  - no-intervention

expected:
  RecordTobaccoUse: false
  AdviseToQuit: false
  OfferPharmacotherapy: false
  OfferBehavioralTherapy: false
  AgeInYears: 40
  IsCurrentTobaccoUser: false
  IsPregnant: false

resources:
  - resourceType: Patient
    id: tob-never-smoker
    meta:
      profile:
        - http://hl7.org/fhir/us/qicore/StructureDefinition/qicore-patient
      tag:
        - system: http://example.org/test-lifecycle
          code: tob-test
        - system: http://example.org/test-lifecycle
          code: tob-never-smoker
    extension:
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-race
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2028-9"
              display: Asian
          - url: text
            valueString: Asian
      - url: http://hl7.org/fhir/us/core/StructureDefinition/us-core-ethnicity
        extension:
          - url: ombCategory
            valueCoding:
              system: urn:oid:2.16.840.1.113883.6.238
              code: "2135-2"
              display: Hispanic or Latino
          - url: text
            valueString: Hispanic or Latino
    identifier:
      - system: http://hospital.smarthealthit.org
        value: tob-never-smoker
    name:
      - family: Smoker
        given:
          - Never
    gender: female
    birthDate:
      $fn: yearsAgo
      years: 40

  - resourceType: Observation
    id: tob-never-smoker-smoking
    meta:
      profile:
        - http://hl7.org/fhir/us/core/StructureDefinition/us-core-smokingstatus
      tag:
        - system: http://example.org/test-lifecycle
          code: tob-test
        - system: http://example.org/test-lifecycle
          code: tob-never-smoker
    status: final
    category:
      - coding:
          - system: http://terminology.hl7.org/CodeSystem/observation-category
            code: social-history
            display: Social History
    code:
      coding:
        - system: http://loinc.org
          code: "72166-2"
          display: Tobacco smoking status
    subject:
      reference: Patient/tob-never-smoker
    effectiveDateTime:
      $fn: daysAgo
      days: 90
    valueCodeableConcept:
      coding:
        - system: http://snomed.info/sct
          code: "266919005"
          display: Never smoked tobacco
